apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-lab-portfolio
  labels:
    app: cloud-lab-portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-lab-portfolio
  template:
    metadata:
      labels:
        app: cloud-lab-portfolio
    spec:
      containers:
        - name: app
          image: cloud-lab-portfolio:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-lab-portfolio
spec:
  selector:
    app: cloud-lab-portfolio
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
