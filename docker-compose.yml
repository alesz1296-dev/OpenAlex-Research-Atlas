services:
  api:
    build:
      context: .
    container_name: openalex-research-atlas-api
    environment:
      DATABASE_URL: postgresql://openalex_user:openalex_password@postgres:5432/openalex_research
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      AZURE_OPENAI_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: openalex-research-atlas-postgres
    environment:
      POSTGRES_DB: openalex_research
      POSTGRES_USER: openalex_user
      POSTGRES_PASSWORD: openalex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openalex_user -d openalex_research"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16
    container_name: openalex-research-atlas-postgres-test
    profiles:
      - test
    environment:
      POSTGRES_DB: openalex_research_test
      POSTGRES_USER: openalex_user
      POSTGRES_PASSWORD: openalex_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openalex_user -d openalex_research_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: openalex-research-atlas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.2.3
    container_name: openalex-research-atlas-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
