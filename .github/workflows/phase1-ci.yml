name: Phase 1 CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  phase1-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openalex_research
          POSTGRES_USER: openalex_user
          POSTGRES_PASSWORD: openalex_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openalex_user -d openalex_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://openalex_user:openalex_password@localhost:5432/openalex_research
      TEST_DATABASE_URL: postgresql://openalex_user:openalex_password@localhost:5432/openalex_research
      ENVIRONMENT: testing
      DEBUG: "false"
      AZURE_OPENAI_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run compile checks
        run: python -m compileall src scripts tests alembic

      - name: Run import checks
        run: python -c "import src.api.app, src.ingestion.openalex, src.ai.azure_openai, src.evaluation.harness; print('imports ok')"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run Phase 1 test suite
        run: pytest -q
